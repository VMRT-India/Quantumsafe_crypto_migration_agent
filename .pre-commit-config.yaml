# =============================================================================
# Pre-commit hooks — IBM Dev Day Hackathon
# Run: pre-commit install   (once per clone)
# Run: pre-commit run --all-files  (manual check)
# =============================================================================
repos:
  # Secret scanning — [IBM-SECURITY] must remain enabled
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: "[IBM-SECURITY] detect-secrets — block committed credentials"
        args: ["--baseline", ".secrets.baseline"]

  # Standard pre-commit hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: no-commit-to-branch
        args: [--branch, main]

  # Python linting / formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
