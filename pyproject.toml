[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qsma"
version = "0.1.0"
description = "Quantum-Safe Crypto Migration Agent — IBM Dev Day Hackathon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    # CLI framework
    "click>=8.1",
    "rich>=13.0",          # terminal output formatting

    # AST / static analysis
    # tree-sitter: PRIMARY multi-language parser — Analyzer + Detector (all languages)
    "tree-sitter>=0.21",
    # Individual tree-sitter grammars — one per supported language
    "tree-sitter-python>=0.21",
    "tree-sitter-java>=0.21",
    "tree-sitter-go>=0.21",
    "tree-sitter-c>=0.21",
    "tree-sitter-rust>=0.21",
    # libcst: Python-only lossless CST — used ONLY in Migrator for Python transforms (ADR-003)
    "libcst>=1.1",

    # Agentic orchestration — LangGraph (ADR-007)
    # Provider-agnostic; backed by watsonx.ai via LLMClient
    "langgraph>=0.2",
    "langgraph-checkpoint-redis>=0.1",  # Redis checkpointer for session persistence (ADR-008)

    # LLM integration — IBM watsonx.ai is the DEFAULT provider
    # Switch provider via LLM_PROVIDER in .env — no code change required.
    "ibm-watsonx-ai>=1.0",

    # Session persistence — Redis (ADR-008)
    # Optional at runtime: if Redis unavailable, tool falls back to stateless mode
    "redis>=5.0",

    # Dependency graph persistence — Neo4j (ADR-010)
    # Optional at runtime: if NEO4J_URI unset, Detector falls back to in-memory DependencyGraph only
    "neo4j>=5.0",

    # Configuration / environment
    "python-dotenv>=1.0",
    "pydantic>=2.5",       # data models and contract validation; MigrationSessionState is LangGraph state

    # Utility
    "typing-extensions>=4.9",
    "pathspec>=0.12",      # .gitignore-style path matching for codebase ingestion
]

[project.optional-dependencies]
# Optional LLM provider SDKs — install only what you need
# pip install 'qsma[llm-openai]'      → OpenAI-compatible endpoint support
# pip install 'qsma[llm-anthropic]'   → Anthropic-compatible endpoint support
# pip install 'qsma[llm-all]'         → all LLM providers
llm-openai = [
    "openai>=1.30",        # any OpenAI-compatible endpoint
]
llm-anthropic = [
    "anthropic>=0.25",     # any Anthropic-compatible endpoint
]
llm-all = [
    "openai>=1.30",
    "anthropic>=0.25",
]
# Optional: vector DB for semantic retrieval of patterns/tools when the library grows large
# pip install 'qsma[qdrant]'
# See PROJECT_CONTEXT.md §13 "When to use Qdrant"
qdrant = [
    "qdrant-client>=1.9",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[project.scripts]
qsma = "qsma.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=qsma --cov-report=term-missing"
