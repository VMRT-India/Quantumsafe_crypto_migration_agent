[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qsma"
version = "0.1.0"
description = "Quantum-Safe Crypto Migration Agent — IBM Dev Day Hackathon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    # CLI framework
    "click>=8.1",
    "rich>=13.0",          # terminal output formatting

    # AST / static analysis
    "libcst>=1.1",         # concrete syntax tree — lossless Python AST transforms
    "tree-sitter>=0.21",   # multi-language parsing (future extension)

    # LLM integration — IBM watsonx.ai is the DEFAULT provider
    # Switch provider via LLM_PROVIDER in .env — no code change required.
    "ibm-watsonx-ai>=1.0",

    # Configuration / environment
    "python-dotenv>=1.0",
    "pydantic>=2.5",       # data models and contract validation

    # Utility
    "typing-extensions>=4.9",
    "pathspec>=0.12",      # .gitignore-style path matching for codebase ingestion
]

[project.optional-dependencies]
# Optional LLM provider SDKs — install only what you need
# pip install 'qsma[llm-openai]'      → OpenAI-compatible endpoint support
# pip install 'qsma[llm-anthropic]'   → Anthropic-compatible endpoint support
# pip install 'qsma[llm-all]'         → all LLM providers
llm-openai = [
    "openai>=1.30",        # any OpenAI-compatible endpoint
]
llm-anthropic = [
    "anthropic>=0.25",     # any Anthropic-compatible endpoint
]
llm-all = [
    "openai>=1.30",
    "anthropic>=0.25",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[project.scripts]
qsma = "qsma.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=qsma --cov-report=term-missing"
